apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dingdong-data
  namespace: dingdong
spec:
  # ReadWriteOnce is sufficient because the Deployment uses strategy.type=Recreate;
  # only one pod ever mounts this volume at a time. SQLite is single-writer
  # regardless, so RWO + Recreate is the safe pairing.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
