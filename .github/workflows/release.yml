name: Release

# Build a multi-arch image, push it to GHCR, then open a PR that bumps the new
# tag into k8s/kustomization.yaml. The PR is enabled for auto-merge with
# squash, so once required checks pass it merges itself and the GitOps
# controller (Flux/ArgoCD/etc.) rolls out the new image automatically.
#
# The PR is created with a fine-scoped PAT (secrets.DEPLOY_BOT_TOKEN) instead
# of GITHUB_TOKEN. This is required because PRs created by GITHUB_TOKEN do
# not trigger workflows, which would mean the required `go` and `image`
# checks never run and auto-merge sits forever.
#
# Loop-prevention: the bump-PR's squash-merge commit only touches
# k8s/kustomization.yaml and the paths-ignore filter below catches it. The
# [skip ci] token in the commit body is a belt-and-braces backup.
#
# Prereqs (one-time, repo-level, not encoded here):
#   - Repo setting: allow_auto_merge=true
#       gh api -X PATCH repos/<owner>/<repo> -F allow_auto_merge=true
#   - Secret: DEPLOY_BOT_TOKEN — fine-scoped PAT with contents:write,
#     pull-requests:write on this repo.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/kustomization.yaml'
      - '**.md'
      - '.github/**'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bryanneva/dingdong

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          short="main-$(echo "${{ github.sha }}" | cut -c1-7)"
          {
            echo "short=${short}"
            echo "list<<EOF"
            echo "${IMAGE}:main"
            echo "${IMAGE}:${short}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump kustomize image tag
        env:
          SHORT: ${{ steps.tags.outputs.short }}
        run: |
          set -euo pipefail
          # yq is preinstalled on ubuntu-latest runners (mikefarah variant).
          yq -i '
            (.images[] | select(.name == "ghcr.io/bryanneva/dingdong") | .newTag) = strenv(SHORT)
          ' k8s/kustomization.yaml
          git diff --stat k8s/kustomization.yaml || true

      - name: Open deploy-bump PR with auto-merge
        env:
          SHORT: ${{ steps.tags.outputs.short }}
          GH_TOKEN: ${{ secrets.DEPLOY_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet k8s/kustomization.yaml; then
            echo "kustomization.yaml unchanged — nothing to commit"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: DEPLOY_BOT_TOKEN secret is not set; cannot open the deploy-bump PR." >&2
            echo "Create a fine-scoped PAT (contents:write, pull-requests:write) and store it as DEPLOY_BOT_TOKEN." >&2
            exit 1
          fi
          branch="chore/deploy-bump-${SHORT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reuse the token for the push, not just the gh CLI calls.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # `git switch -c` would fail if a previous Release run already created
          # the branch locally. Force-create so re-runs are idempotent.
          git switch -C "$branch"
          git add k8s/kustomization.yaml
          git commit -m "chore(deploy): bump image to ${SHORT}" -m "[skip ci]"
          # --force-with-lease handles a stale remote branch left over from a
          # prior run that failed between push and merge.
          git push -u --force-with-lease origin "$branch"
          # Skip create if a prior run already opened the PR for this SHA.
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore(deploy): bump image to ${SHORT}" \
              --body "Auto-generated by release.yml from $GITHUB_SHA. Auto-merges once required checks pass." \
              --label deploy \
              --head "$branch" \
              --base main
          else
            echo "PR #${existing} already exists for ${branch}; skipping create."
          fi
          gh pr merge --auto --squash --delete-branch "$branch"
