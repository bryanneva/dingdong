build:
  command: "make build"
  frontend_dir: null
  backend_dir: "."

server:
  start: "./bin/dingdong --addr :8080"
  port: 8080
  health_check: "/healthz"
  env:
    DINGDONG_TOKEN: "localdev"

frontend:
  dev_url: "http://localhost:8080"
  file_patterns:
    - "internal/ui/static/**"

backend:
  file_patterns:
    - "main.go"
    - "internal/**/*.go"
    - "cmd/**/*.go"
    - "go.mod"
    - "go.sum"
  api_base: "http://localhost:8080"

seeding:
  strategy: "none"
  api_steps: []
  cleanup: []

auth:
  disabled_via: "none"
  env_flags: []
