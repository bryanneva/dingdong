<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dingdong</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%9A%AA%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0e0f12;
        --panel: #181a20;
        --panel-2: #14161c;
        --border: #2a2d36;
        --text: #e6e8ee;
        --muted: #9aa2b1;
        --accent: #ffb84d;
        --selected-bg: #2a2d36;
        --hover-bg: #20222a;
        --kind-knock: #ffb84d;
        --kind-ready: #6ddf7e;
        --kind-need: #ff7d7d;
        --kind-info: #7db6ff;
        --kind-reply: #c79dff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--text);
        display: flex; flex-direction: column;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .channel-name {
        font-size: 14px; color: var(--muted); font-weight: 500;
        padding-left: 8px; border-left: 1px solid var(--border);
      }
      header .channel-name strong { color: var(--text); }
      header .spacer { flex: 1; }
      header .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: var(--muted);
      }
      header .dot.live { background: var(--kind-ready); box-shadow: 0 0 6px var(--kind-ready); }
      header input[type="text"] {
        padding: 6px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: #0b0c10; color: var(--text);
        font: inherit; min-width: 160px;
      }
      header label { color: var(--muted); font-size: 12px; }
      header button {
        padding: 6px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: #0b0c10; color: var(--text);
        cursor: pointer; font: inherit;
      }
      header button:hover { border-color: var(--accent); color: var(--accent); }

      .layout {
        flex: 1; display: flex; min-height: 0;
      }
      aside#sidebar {
        width: 220px; flex-shrink: 0;
        background: var(--panel-2);
        border-right: 1px solid var(--border);
        display: flex; flex-direction: column;
        overflow-y: auto;
      }
      aside#sidebar .sidebar-header {
        padding: 12px 16px 6px;
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted); font-weight: 600;
      }
      aside#sidebar ul {
        list-style: none; padding: 0; margin: 0;
      }
      aside#sidebar li {
        padding: 6px 16px;
        cursor: pointer; user-select: none;
        color: var(--text);
        display: flex; align-items: center; gap: 6px;
      }
      aside#sidebar li:hover { background: var(--hover-bg); }
      aside#sidebar li.active {
        background: var(--selected-bg); color: var(--accent); font-weight: 600;
      }
      aside#sidebar li:focus { outline: none; }
      aside#sidebar li:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        background: var(--hover-bg);
      }
      aside#sidebar li.active:focus-visible { background: var(--selected-bg); }
      aside#sidebar li .hash { color: var(--muted); }
      aside#sidebar li.active .hash { color: var(--accent); }

      aside#sidebar .webhooks-section {
        margin-top: 16px; border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      aside#sidebar .webhook {
        padding: 4px 16px;
        font-size: 12px; color: var(--muted);
        display: flex; flex-direction: column; gap: 2px;
        cursor: default;
      }
      aside#sidebar .webhook .url {
        color: var(--text); word-break: break-all;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      aside#sidebar .webhook .topic { color: var(--accent); }
      aside#sidebar .webhook .empty-hint { font-style: italic; }

      main#feed {
        flex: 1; overflow-y: auto; padding: 12px 16px;
        display: flex; flex-direction: column; gap: 8px; min-width: 0;
      }
      .knock {
        padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
        background: var(--panel); display: grid;
        grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: baseline;
      }
      .knock .kind {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
        padding: 2px 6px; border-radius: 4px; background: #0b0c10;
        border: 1px solid currentColor;
      }
      .kind-knock { color: var(--kind-knock); }
      .kind-ready { color: var(--kind-ready); }
      .kind-need  { color: var(--kind-need); }
      .kind-info  { color: var(--kind-info); }
      .kind-reply { color: var(--kind-reply); }
      .knock .from { color: var(--muted); font-size: 12px; }
      .knock .from .arrow { margin: 0 4px; }
      .knock .ts { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .knock .subject { grid-column: 1 / -1; font-weight: 600; }
      .knock .body {
        grid-column: 1 / -1; color: var(--muted);
        white-space: pre-wrap; font-size: 13px;
      }
      .empty { color: var(--muted); padding: 24px; text-align: center; }
      .auth-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.7);
        display: flex; align-items: center; justify-content: center;
      }
      .auth-overlay[hidden] { display: none; }
      .auth-overlay form {
        background: var(--panel); padding: 24px; border-radius: 10px;
        border: 1px solid var(--border); display: grid; gap: 12px; min-width: 320px;
      }
      .auth-overlay h2 { margin: 0; font-size: 16px; }
      .auth-overlay input {
        padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
        background: #0b0c10; color: var(--text); font: inherit;
      }
      .auth-overlay button {
        padding: 8px 12px; border-radius: 6px; border: 1px solid var(--accent);
        background: transparent; color: var(--accent); cursor: pointer; font: inherit;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="status-dot" title="disconnected"></span>
      <h1>dingdong</h1>
      <span class="channel-name">#<strong id="active-channel">main</strong></span>
      <span class="spacer"></span>
      <label for="to">to</label>
      <input id="to" type="text" placeholder="(any recipient)" />
      <button id="clear">clear</button>
      <button id="logout">forget token</button>
    </header>
    <div class="layout">
      <aside id="sidebar">
        <div class="sidebar-header">Channels</div>
        <ul id="channel-list"></ul>
        <div class="webhooks-section">
          <div class="sidebar-header">Webhooks</div>
          <div id="webhook-list"></div>
        </div>
      </aside>
      <main id="feed"><div class="empty">connecting…</div></main>
    </div>
    <div class="auth-overlay" id="auth-overlay" hidden>
      <form id="auth-form">
        <h2>enter dingdong token</h2>
        <input id="token-input" type="password" autocomplete="off" placeholder="DINGDONG_TOKEN" />
        <button type="submit">connect</button>
      </form>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
